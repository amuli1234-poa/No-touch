<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WickSentinel — See Beyond the Candles. Understand the Market.</title>
    <meta name="description" content="WickSentinel is an independent market intelligence platform for synthetic indices — structured scanning, candle and wick analysis, and transparent signal evaluation." />
    <meta property="og:title" content="WickSentinel — Independent Market Intelligence Platform" />
    <meta property="og:description" content="See Beyond the Candles. Understand the Market. Structured market scanning and analytical intelligence for synthetic indices." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#060b16" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      /* Resolve the theme before first paint so there is no flash of the wrong
         palette. Stored choice wins; otherwise follow the OS preference. */
      (function () {
        try {
          var stored = localStorage.getItem('ws-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-app text-fg-1 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
