<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WickSentinel Admin — Platform Control Centre</title>
    <meta name="description" content="Administrative control centre for the WickSentinel platform: users, subscriptions, analytics, scanner operations, system health and audit." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0068b5" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      /* Resolve the theme before first paint to avoid a flash of the wrong palette. */
      (function () {
        try {
          var stored = localStorage.getItem('ws_admin_theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="admin-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
